name: CSign experience UI verification
on:
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Build actual CSign app for simulator
        run: |
          make deps
          xcodebuild -project CSign.xcodeproj -scheme CSign -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath .derivedData/simulator -clonedSourcePackagesDirPath SourcePackages -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO DSTROOT="$RUNNER_TEMP/csign-simulator" > "$RUNNER_TEMP/simulator-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/simulator-build.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/csign-simulator/Applications/CSign.app/signing-assets/DefaultCert"
          cp BuiltInCert/* "$RUNNER_TEMP/csign-simulator/Applications/CSign.app/signing-assets/DefaultCert/"
          cp deps/* "$RUNNER_TEMP/csign-simulator/Applications/CSign.app/"
      - name: Boot iPhone and install CSign
        run: |
          CSIGN_DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          echo "CSIGN_DEVICE=$CSIGN_DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$CSIGN_DEVICE"
          xcrun simctl bootstatus "$CSIGN_DEVICE" -b
          xcrun simctl status_bar "$CSIGN_DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$CSIGN_DEVICE" "$RUNNER_TEMP/csign-simulator/Applications/CSign.app"
      - name: Verify real UI actions and capture screens
        run: |
          brew install xcodegen
          xcodegen generate --spec Tests/ExperienceUI/project.yml --project Tests/ExperienceUI
          xcodebuild test -project Tests/ExperienceUI/ExperienceUI.xcodeproj -scheme ExperienceUI -destination "platform=iOS Simulator,id=$CSIGN_DEVICE" -resultBundlePath "$RUNNER_TEMP/experience-ui.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/experience-ui.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/experience-ui.xcresult" --output-path "$RUNNER_TEMP/experience-screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CSign-interface-verification
          path: |
            ${{ runner.temp }}/experience-screenshots
            ${{ runner.temp }}/experience-ui.xcresult
            ${{ runner.temp }}/simulator-build.log
