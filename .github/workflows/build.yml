name: Build CSign IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  signing-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test production signer and provisioning behavior
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v

  build:
    needs: signing-regressions
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare Build Environment
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Test install links and progress lifecycle
        run: |
          swiftc CSign/Utilities/InstallationLinks.swift CSign/Utilities/InstallProgressTracker.swift CSign/Utilities/SigningProgress.swift Tests/RegressionTests.swift -o "$RUNNER_TEMP/csign-regressions"
          "$RUNNER_TEMP/csign-regressions"

      - name: Test IPA packaging and bundle preservation
        run: python3 Tests/archive_regressions.py

      - name: Xcode Cache
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-
          deriveddata-directory: .derivedData/iphoneos

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build IPA
        run: |
          make iphoneos

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSign
          path: packages/CSign.ipa
